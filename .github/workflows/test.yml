name: Testy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-timeout=60000 --test-reporter=spec --test-reporter=./test/ci-reporter.js --test-reporter-destination=stdout --test-reporter-destination=stdout test/e2e.test.js
